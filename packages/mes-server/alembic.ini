# Alembic configuration for developers.
#
# Create a migration after changing mes_server/db/models.py (run from the repository root):
#   uv run alembic -c packages/mes-server/alembic.ini revision --autogenerate -m "describe change"
#
# The database URL is read from the MES_DATABASE_URL environment variable
# (default: sqlite:///mes.db). To apply migrations use:  uv run mes-server db upgrade

[alembic]
script_location = %(here)s/src/mes_server/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[post_write_hooks]
# Format new migrations with the same rules as the rest of the code.
hooks = ruff_format, ruff_check
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
